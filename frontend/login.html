<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<input type="email"
       id="email"
       placeholder="Email">

<br><br>

<input type="password"
       id="password"
       placeholder="Password">

<br><br>

<button onclick="login()">
    Login
</button>

<p id="result"></p>

<script>

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const response =
        await fetch(
            "http://localhost:3000/login",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

    const data =
        await response.json();

    document.getElementById(
        "result"
    ).innerText =
    data.message;

}

</script>

</body>
</html>
